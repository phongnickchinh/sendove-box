# CI/CD cho cả 3 phần: firmware ESP32-C3, backend (Firebase Functions), web (Vite).
#
# CẦN TẠO 2 SECRET trong Settings > Secrets and variables > Actions:
#   WEB_ENV_PRODUCTION      — chép nguyên nội dung sendlove_web/.env (8 dòng VITE_FIREBASE_*
#                             + VITE_API_URL trỏ tới https://us-central1-iot-app-839a2.cloudfunctions.net/api).
#                             Thiếu nó thì bản build thiếu cấu hình Firebase và trang web hỏng.
#   FIREBASE_SERVICE_ACCOUNT — JSON service account có quyền deploy (Firebase Admin +
#                             Cloud Functions Admin + Service Account User + Artifact Registry Writer).
#                             KHÔNG dùng serviceAccountKey.json của backend nếu nó không đủ quyền deploy.
#
# Deploy CỐ Ý không đụng `storage`: rules Storage đang ở trạng thái đã kiểm chứng tay,
# deploy lại từ CI mà sai thứ tự là chết đường tải media (MEMORY.md §11, §19).
#
# Thứ tự deploy PHẢI LÀ: database → functions → hosting (MEMORY.md §22 gotcha).
# Flash firmware TRƯỚC khi push code nếu schema Firebase Realtime DB thay đổi,
# tránh PUT alarm bị từ chối bởi rules mới → dirty flag không bao giờ xoá được.

name: CI/CD

on:
  push:
    branches: [main]
  # Chạy CI trên PR để bắt lỗi trước khi merge vào main. Deploy chỉ chạy khi push vào main.
  pull_request:
    branches: [main]

permissions:
  contents: read

# Hai lần push sát nhau không được deploy chồng lên nhau.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    name: Firmware (ESP32-C3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('sendlove_firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - run: pip install --upgrade platformio

      # Giá trị giả, chỉ đủ để biên dịch. File .bin sinh ra ở đây KHÔNG nạp được
      # vào hộp thật (sai FIREBASE_HOST/BOX_ID) — nó chỉ để bắt lỗi biên dịch/link.
      - name: Tạo config_secrets.h từ template
        run: cp sendlove_firmware/include/config_secrets.h.example sendlove_firmware/include/config_secrets.h

      - run: pio run -d sendlove_firmware

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: sendlove_firmware/.pio/build/esp32-c3-devkitm-1/firmware.bin
          if-no-files-found: error

  backend:
    name: Backend (Functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sendlove_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sendlove_backend/package-lock.json

      # `npm ci` ở đây chạy đúng npm 10 như Cloud Build. Chính bước này bắt được
      # lỗi lock file lệch đã làm deploy functions fail ngày 2026-09-18.
      - run: npm ci
      - run: npm run build
      - run: npx jest --ci

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sendlove_web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sendlove_web/package-lock.json

      - run: npm ci
      - run: npm run lint

      # Vite nhúng biến môi trường LÚC BUILD. .env.production.local đè .env.production
      # đã commit, nên VITE_API_URL vẫn trỏ function thật nếu secret không có dòng đó.
      - name: Ghi .env.production.local từ secret
        env:
          WEB_ENV: ${{ secrets.WEB_ENV_PRODUCTION }}
        run: |
          if [ -z "$WEB_ENV" ]; then
            echo "::error::Thiếu secret WEB_ENV_PRODUCTION — build sẽ thiếu cấu hình Firebase"
            exit 1
          fi
          printf '%s\n' "$WEB_ENV" > .env.production.local

      - run: npm run build

      - name: Chốt chặn — bundle không được trỏ localhost
        run: |
          if grep -rq "127.0.0.1:5001" dist/assets/*.js; then
            echo "::error::Bundle vẫn gọi emulator, kiểm tra VITE_API_URL"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: sendlove_web/dist
          if-no-files-found: error

  deploy:
    name: Deploy Firebase (hosting + functions + rules)
    # Firmware không deploy qua CI (file .bin chỉ dùng để kiểm tra build),
    # nhưng nếu firmware fail build thì deploy cũng block lại — tránh push code
    # web/backend mà firmware đang bị broken.
    needs: [firmware, backend, web]
    # Chỉ deploy khi push vào main, không deploy khi mở PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sendlove_backend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: sendlove_web/dist

      # predeploy của functions trong firebase.json chạy `npm run build` tại chỗ,
      # nên cần devDependencies (typescript) của backend.
      - name: Cài dependencies backend
        run: npm ci --prefix sendlove_backend

      - name: Ghi service account ra file tạm
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Thiếu secret FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Thứ tự PHẢI LÀ: database → functions → hosting (§22 gotcha).
      # Nếu deploy database rules trước thì firmware cũ (chưa flash) bị từ chối PUT alarm
      # → dirty flag không bao giờ xoá → box PUT mỗi 10s thêm 1 handshake TLS (§21).
      # firebase-tools xử lý tuần tự theo thứ tự khai báo trong --only.
      - name: Deploy
        run: >
          npx --yes firebase-tools@15 deploy
          --only database,functions,hosting
          --project iot-app-839a2
          --non-interactive

      - name: Xoá key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

