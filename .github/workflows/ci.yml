# CI/CD for firmware (ESP32-C3), backend (Firebase Functions) and web (Vite).
#
# REQUIRES 2 SECRETS (Settings > Secrets and variables > Actions):
#   WEB_ENV_PRODUCTION       — the contents of sendlove_web/.env (VITE_FIREBASE_* +
#                              VITE_API_URL = https://us-central1-iot-app-839a2.cloudfunctions.net/api)
#   FIREBASE_SERVICE_ACCOUNT — service account JSON with deploy rights (Firebase Admin, Cloud
#                              Functions Admin, Service Account User, Artifact Registry Writer)
#
# Deploy DELIBERATELY skips `storage`: its rules are hand-verified (MEMORY.md §11, §19).
# Deploy order MUST BE database → functions → hosting (MEMORY.md §22). When the
# Realtime DB schema changes, flash firmware BEFORE pushing code (new rules reject old
# firmware's alarm PUT and its dirty flag never clears, MEMORY.md §21).

name: CI/CD

on:
  push:
    branches: [main]
  # PRs run CI only; deploy runs on push to main.
  pull_request:
    branches: [main]

permissions:
  contents: read

# Never run two deploys at once.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    name: Firmware (ESP32-C3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('sendlove_firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - run: pip install --upgrade platformio

      # Dummy secrets: this .bin only proves the firmware builds; do NOT flash it.
      - name: Tạo config_secrets.h từ template
        run: cp sendlove_firmware/include/config_secrets.h.example sendlove_firmware/include/config_secrets.h

      - run: pio run -d sendlove_firmware

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: sendlove_firmware/.pio/build/esp32-c3-devkitm-1/firmware.bin
          if-no-files-found: error

  backend:
    name: Backend (Functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sendlove_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sendlove_backend/package-lock.json

      # `npm ci` (npm 10, as in Cloud Build) catches an out-of-sync lock file.
      - run: npm ci
      - run: npm run build
      - run: npx jest --ci

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sendlove_web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sendlove_web/package-lock.json

      - run: npm ci
      - run: npm run lint

      # Vite embeds env variables AT BUILD TIME; .env.production.local overrides the
      # committed .env.production.
      - name: Ghi .env.production.local từ secret
        env:
          WEB_ENV: ${{ secrets.WEB_ENV_PRODUCTION }}
        run: |
          if [ -z "$WEB_ENV" ]; then
            echo "::error::Thiếu secret WEB_ENV_PRODUCTION — build sẽ thiếu cấu hình Firebase"
            exit 1
          fi
          printf '%s\n' "$WEB_ENV" > .env.production.local

      - run: npm run build

      - name: Chốt chặn — bundle không được trỏ localhost
        run: |
          if grep -rq "127.0.0.1:5001" dist/assets/*.js; then
            echo "::error::Bundle vẫn gọi emulator, kiểm tra VITE_API_URL"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: sendlove_web/dist
          if-no-files-found: error

  deploy:
    name: Deploy Firebase (hosting + functions + rules)
    # Firmware isn't deployed by CI, but a failing firmware build blocks the deploy.
    needs: [firmware, backend, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sendlove_backend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: sendlove_web/dist

      # The functions predeploy hook runs `npm run build`, which needs devDependencies.
      - name: Cài dependencies backend
        run: npm ci --prefix sendlove_backend

      - name: Ghi service account ra file tạm
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Thiếu secret FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Order MUST BE database → functions → hosting (MEMORY.md §22): firebase-tools
      # deploys targets in the order given to --only.
      - name: Deploy
        run: >
          npx --yes firebase-tools@15 deploy
          --only database,functions,hosting
          --project iot-app-839a2
          --non-interactive

      - name: Xoá key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

