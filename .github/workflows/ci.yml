# CI/CD for all 3 parts: ESP32-C3 firmware, backend (Firebase Functions), web (Vite).
#
# REQUIRES 2 SECRETS in Settings > Secrets and variables > Actions:
#   WEB_ENV_PRODUCTION      — the full contents of sendlove_web/.env (8 VITE_FIREBASE_* lines
#                             + VITE_API_URL pointing at https://us-central1-iot-app-839a2.cloudfunctions.net/api).
#                             Without it the build lacks the Firebase config and the site breaks.
#   FIREBASE_SERVICE_ACCOUNT — service account JSON allowed to deploy (Firebase Admin +
#                             Cloud Functions Admin + Service Account User + Artifact Registry Writer).
#                             Do NOT use the backend's serviceAccountKey.json unless it has deploy rights.
#
# Deploy DELIBERATELY leaves `storage` alone: the Storage rules are in a hand-verified state,
# and redeploying them from CI in the wrong order kills media downloads (MEMORY.md §11, §19).
#
# Deploy order MUST BE: database → functions → hosting (MEMORY.md §22 gotcha).
# Flash firmware BEFORE pushing code when the Realtime DB schema changes, or the new
# rules reject the alarm PUT → the dirty flag can never be cleared.

name: CI/CD

on:
  push:
    branches: [main]
  # CI runs on PRs to catch errors before merging to main. Deploy only runs on push to main.
  pull_request:
    branches: [main]

permissions:
  contents: read

# Two pushes in quick succession must not deploy on top of each other.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    name: Firmware (ESP32-C3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('sendlove_firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - run: pip install --upgrade platformio

      # Dummy values, just enough to compile. The .bin built here can NOT be flashed
      # to a real box (wrong FIREBASE_HOST/BOX_ID) — it only catches compile/link errors.
      - name: Tạo config_secrets.h từ template
        run: cp sendlove_firmware/include/config_secrets.h.example sendlove_firmware/include/config_secrets.h

      - run: pio run -d sendlove_firmware

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: sendlove_firmware/.pio/build/esp32-c3-devkitm-1/firmware.bin
          if-no-files-found: error

  backend:
    name: Backend (Functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sendlove_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sendlove_backend/package-lock.json

      # `npm ci` here runs npm 10, same as Cloud Build. This step catches an
      # out-of-sync lock file, which otherwise fails the functions deploy.
      - run: npm ci
      - run: npm run build
      - run: npx jest --ci

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sendlove_web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sendlove_web/package-lock.json

      - run: npm ci
      - run: npm run lint

      # Vite embeds env variables AT BUILD TIME. .env.production.local overrides the
      # committed .env.production, so VITE_API_URL still points at the real function
      # when the secret lacks that line.
      - name: Ghi .env.production.local từ secret
        env:
          WEB_ENV: ${{ secrets.WEB_ENV_PRODUCTION }}
        run: |
          if [ -z "$WEB_ENV" ]; then
            echo "::error::Thiếu secret WEB_ENV_PRODUCTION — build sẽ thiếu cấu hình Firebase"
            exit 1
          fi
          printf '%s\n' "$WEB_ENV" > .env.production.local

      - run: npm run build

      - name: Chốt chặn — bundle không được trỏ localhost
        run: |
          if grep -rq "127.0.0.1:5001" dist/assets/*.js; then
            echo "::error::Bundle vẫn gọi emulator, kiểm tra VITE_API_URL"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: sendlove_web/dist
          if-no-files-found: error

  deploy:
    name: Deploy Firebase (hosting + functions + rules)
    # Firmware isn't deployed by CI (the .bin is only a build check), but a failing
    # firmware build still blocks the deploy — no shipping web/backend code while
    # the firmware is broken.
    needs: [firmware, backend, web]
    # Deploy only on push to main, never on a PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sendlove_backend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: sendlove_web/dist

      # The functions predeploy hook in firebase.json runs `npm run build` in place,
      # so the backend's devDependencies (typescript) are needed.
      - name: Cài dependencies backend
        run: npm ci --prefix sendlove_backend

      - name: Ghi service account ra file tạm
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Thiếu secret FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Order MUST BE: database → functions → hosting (MEMORY.md §22 gotcha).
      # With database rules deployed first, old (unflashed) firmware gets its alarm PUT
      # rejected → the dirty flag never clears → the box PUTs every 10s, one extra TLS
      # handshake each (§21). firebase-tools processes targets in the order given to --only.
      - name: Deploy
        run: >
          npx --yes firebase-tools@15 deploy
          --only database,functions,hosting
          --project iot-app-839a2
          --non-interactive

      - name: Xoá key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

