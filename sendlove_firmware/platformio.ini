; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = partitions_ota.csv

monitor_speed = 115200

; monitor_dtr = 0
; monitor_rts = 0

; --- Thư viện bên thứ 3 ---
lib_deps =
    lovyan03/LovyanGFX@^1.1.12
    bitbank2/JPEGDEC
    bblanchon/ArduinoJson@^7.0.0

; --- Build flags ---
; LovyanGFX: Cấu hình trong code (DisplayDriver), không cần defines ở đây
; USB CDC: Serial qua USB nội bộ ESP32-C3 (GPIO 18/19)
build_flags =
    -I include
    ; -D ARDUINO_USB_CDC_ON_BOOT=1
    ; -D ARDUINO_USB_MODE=1
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

build_unflags =
    -O2
    -O3
    -Og

; Env `wokwi` (mô phỏng) đã xoá 2026-09-18: bị comment toàn bộ từ lâu, và cờ
; WOKWI_SIMULATION nó định nghĩa không còn chỗ nào trong code dùng tới.
