; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

; --- Thư viện bên thứ 3 ---
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.0

; --- Build flags ---
; TFT_eSPI: Cấu hình driver ST7735 cho màn hình 1.77 inch 128x160
; Pinout phải khớp với config.h
build_flags =
    -I include
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D TFT_MOSI=6
    -D TFT_MISO=5
    -D TFT_SCLK=4
    -D TFT_CS=7
    -D TFT_DC=8
    -D TFT_RST=10
    -D SPI_FREQUENCY=27000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

; ============================================================================
; Wokwi Simulation Environment
; ============================================================================
; Kế thừa cấu hình chung, thêm flag WOKWI_SIMULATION để:
;   - Thay I2S audio bằng active buzzer
;   - Nút bấm thay cảm biến chạm (không cần thay đổi logic)
; ============================================================================
[env:wokwi]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

; Wokwi không cần upload qua COM port — chặn esptool upload
upload_protocol = custom
upload_command = echo "Wokwi env: use Wokwi simulator, not hardware upload"

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -I include
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=6
    -D TFT_MISO=5
    -D TFT_SCLK=4
    -D TFT_CS=7
    -D TFT_DC=8
    -D TFT_RST=10
    -D SPI_FREQUENCY=27000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D WOKWI_SIMULATION=1

