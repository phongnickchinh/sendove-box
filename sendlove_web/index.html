<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: thiếu nó thì env(safe-area-inset-*) trong tokens.css luôn bằng 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sendlove Box - Gửi yêu thương qua những thông điệp nhỏ bé. Kết nối với Hộp quà thông minh để ghi âm, gửi video và tin nhắn đặc biệt." />
    <!-- Màu thanh trạng thái = nền trang bản sáng (caramel-50). ThemeContext đổi theo khi bật giao diện tối. -->
    <meta name="theme-color" content="#FDF8F3" />
    <!-- Cài lên màn hình chính (PWA). iPhone không đọc icon trong manifest, cần apple-touch-icon riêng. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sendlove" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="Sendlove Box" />
    <meta property="og:description" content="Gửi yêu thương qua những thông điệp nhỏ bé. Kết nối với Hộp quà thông minh." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Dancing Script CHỈ dùng cho logo "SendloveBox" ở màn đăng nhập — xác nhận từ
         Figma (login-signup.json): fontFamily "Dancing Script", không phải Quicksand.
         Mọi chữ khác trong app đều Quicksand. -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Sendlove Box — Gửi yêu thương qua Hộp quà thông minh</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
