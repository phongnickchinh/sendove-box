<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDF8F3" />
    <title>Sendlove Box — Mất kết nối</title>
    <!-- Served by sw.js when the app is opened offline. It stands alone and can't
         load tokens.css, so its colors are copied by hand from tokens.css
         (caramel-50/900, neutral-500, rose-400) and it uses system fonts. -->
    <style>
      body {
        margin: 0; min-height: 100dvh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; padding: 20px; box-sizing: border-box; text-align: center;
        background: #FDF8F3; color: #3D2A20;
        font-family: 'Quicksand', 'Segoe UI', system-ui, sans-serif;
      }
      [data-theme='dark'] body { background: #1C1216; color: #FAEEF0; }
      [data-theme='dark'] p { color: #C9ACB4; }
      h1 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; }
      p { margin: 0; max-width: 320px; font-size: 15px; line-height: 1.6; color: #8A7767; }
      button {
        margin-top: 12px; height: 44px; padding: 0 24px;
        border: none; border-radius: 8px; cursor: pointer;
        background: #F28AA1; color: #3D2A20;
        font-family: inherit; font-size: 14px; font-weight: 600;
      }
    </style>
    <script>
      // Follow the app's own light/dark choice (ThemeContext stores it under this key), not the OS.
      try {
        if (localStorage.getItem('sendlove-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#1C1216';
        }
      } catch { /* storage blocked by the browser: stay light */ }
    </script>
  </head>
  <body>
    <h1>Mất kết nối</h1>
    <p>Sendlove Box cần mạng để gửi và nhận tin. Kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại.</p>
    <button type="button" onclick="location.reload()">Thử lại</button>
  </body>
</html>
